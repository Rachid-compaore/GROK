<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Pop;font-weight:400;src:url(node_modules/@fontsource/poppins/files/poppins-latin-400-normal.woff2)}
@font-face{font-family:Pop;font-weight:600;src:url(node_modules/@fontsource/poppins/files/poppins-latin-600-normal.woff2)}
@font-face{font-family:Pop;font-weight:800;src:url(node_modules/@fontsource/poppins/files/poppins-latin-800-normal.woff2)}
@font-face{font-family:Play;font-weight:900;font-style:italic;src:url(node_modules/@fontsource/playfair-display/files/playfair-display-latin-900-italic.woff2)}
@font-face{font-family:Play;font-weight:700;src:url(node_modules/@fontsource/playfair-display/files/playfair-display-latin-700-normal.woff2)}
:root{--blue:#1d4fb8;--blue2:#0e2c74;--cream:#f4ead8;--brown:#8a3a22;--esp:#1f120b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
.L{position:absolute;inset:0;overflow:hidden}
.a{position:absolute;will-change:transform}
#L1{background:radial-gradient(circle at 50% 45%,#4a2a18 0%,#24140b 55%,#120a05 100%)}
#L2{background:radial-gradient(circle at 50% 40%,#fbf5ea 0%,var(--cream) 60%,#e8d9bd 100%)}
#L3{background:radial-gradient(circle at 50% 40%,#2c63d6 0%,var(--blue) 45%,var(--blue2) 100%)}
#L4{background:radial-gradient(circle at 50% 45%,#fbf5ea 0%,var(--cream) 60%,#e5d3b2 100%)}
.big{font-family:Play;font-weight:900;font-style:italic;text-align:center;width:1080px;left:0}
.word{display:inline-block}
.sans{font-family:Pop}
.sachet{width:640px;height:773px;background:url(sachet.png) center/contain no-repeat;filter:drop-shadow(0 40px 50px rgba(40,20,5,.35))}
.shine{position:absolute;inset:0;-webkit-mask:url(sachet.png) center/contain no-repeat;overflow:hidden}
.shine i{position:absolute;top:-20%;height:140%;width:180px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:rotate(18deg)}
.pill{left:110px;width:860px;height:160px;background:#fff;border-radius:44px;box-shadow:0 20px 40px rgba(60,35,10,.15);display:flex;align-items:center;padding:0 36px;gap:32px}
.ic{width:100px;height:100px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff;font-family:Pop;font-weight:800;font-size:30px;flex:none}
.pt b{display:block;font-family:Pop;font-weight:800;font-size:46px;color:var(--esp);line-height:1.1}
.pt span{font-family:Pop;font-size:30px;color:#6b5040}
.cta{left:170px;width:740px;height:130px;border-radius:65px;background:var(--blue);color:#fff;font-family:Pop;font-weight:800;font-size:44px;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px rgba(29,79,184,.4)}
</style></head><body>

<!-- SCENE 1 : intro sombre -->
<div class="L" id="L1">
  <div id="beans"></div>
  <div class="a big" id="s1a" style="top:760px;font-size:96px;color:#f4ead8"></div>
  <div class="a big" id="s1b" style="top:880px;font-size:150px;color:#e9b98a"></div>
</div>

<!-- SCENE 2 : produit + atouts -->
<div class="L" id="L2">
  <div class="a" id="disc" style="left:540px;top:1000px;width:0;height:0">
    <div style="position:absolute;left:-430px;top:-430px;width:860px;height:860px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a72e6,var(--blue) 60%,var(--blue2))"></div>
    <svg id="ring" style="position:absolute;left:-500px;top:-500px" width="1000" height="1000"><circle cx="500" cy="500" r="480" fill="none" stroke="#1d4fb8" stroke-width="4" stroke-dasharray="14 22" opacity=".5"/></svg>
  </div>
  <div class="a big" id="t2" style="top:150px;font-size:150px;color:var(--brown)"></div>
  <div class="a sans" id="t2b" style="top:1560px;left:0;width:1080px;text-align:center;font-weight:600;font-size:46px;color:var(--blue);letter-spacing:2px">MÉLANGE DE CAFÉ <b style="font-weight:800">3 EN 1</b></div>
  <div class="a" id="sach" style="left:0;top:0"><div class="sachet"></div><div class="shine"><i id="shineBar"></i></div></div>
  <div class="a pill" id="p1"><div class="ic">3 en 1</div><div class="pt"><b>3 en 1</b><span>Café, lait et sucre réunis</span></div></div>
  <div class="a pill" id="p2"><div class="ic"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 14c2-3 4-3 6 0s4 3 6 0 3-2 4-1"/><path d="M4 9c2-3 4-3 6 0s4 3 6 0 3-2 4-1"/></svg></div><div class="pt"><b>Crémeux</b><span>Une texture douce et onctueuse</span></div></div>
  <div class="a pill" id="p3"><div class="ic"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg></div><div class="pt"><b>Instantané</b><span>Eau chaude, on mélange, c'est prêt</span></div></div>
</div>

<!-- SCENE 3 : la tasse -->
<div class="L" id="L3">
  <div class="a" id="cup" style="left:540px;top:860px;width:0;height:0">
    <svg style="position:absolute;left:-400px;top:-400px" width="800" height="800" viewBox="-400 -400 800 800">
      <defs>
        <radialGradient id="cof" cx="45%" cy="40%"><stop offset="0" stop-color="#e8c79f"/><stop offset=".6" stop-color="#c8935f"/><stop offset="1" stop-color="#8f5a30"/></radialGradient>
        <radialGradient id="sau" cx="40%" cy="35%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9dfec"/></radialGradient>
      </defs>
      <circle r="380" fill="rgba(0,0,0,.18)" cx="14" cy="24"/>
      <circle r="370" fill="url(#sau)"/>
      <circle r="300" fill="rgba(0,0,0,.08)"/>
      <path d="M232 -60 q120 0 120 60 t-120 60" fill="none" stroke="#1a47a8" stroke-width="44" stroke-linecap="round"/>
      <circle r="250" fill="#1d4fb8"/>
      <circle r="222" fill="#f8f4ec"/>
      <circle r="205" fill="url(#cof)"/>
      <g id="art">
        <ellipse rx="150" ry="140" fill="#c48a55" opacity=".55"/>
        <path d="M0 120 C-40 60 -140 20 -110 -60 C-90 -110 -20 -110 0 -50 C20 -110 90 -110 110 -60 C140 20 40 60 0 120Z" fill="#fbf3e6"/>
        <path d="M0 80 C-25 40 -85 15 -68 -35 C-55 -65 -15 -65 0 -25 C15 -65 55 -65 68 -35 C85 15 25 40 0 80Z" fill="#d9a774"/>
        <path d="M0 45 C-12 25 -40 10 -32 -12 C-25 -28 -6 -28 0 -8 C6 -28 25 -28 32 -12 C40 10 12 25 0 45Z" fill="#fbf3e6"/>
        <path d="M0 120 L0 175" stroke="#fbf3e6" stroke-width="10" stroke-linecap="round"/>
      </g>
    </svg>
    <svg id="steam" style="position:absolute;left:-200px;top:-560px" width="400" height="420" viewBox="0 0 400 420" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="14" stroke-linecap="round">
      <path id="st1" d="M120 400 C80 330 160 290 120 220 S100 120 130 40"/>
      <path id="st2" d="M200 410 C160 330 240 290 200 210 S180 110 210 20"/>
      <path id="st3" d="M280 400 C240 330 320 290 280 220 S260 120 290 40"/>
    </svg>
  </div>
  <div class="a big" id="t3a" style="top:1400px;font-size:84px;color:#fff"></div>
  <div class="a big" id="t3b" style="top:1510px;font-size:84px;color:#f3d2a8"></div>
</div>

<!-- SCENE 4 : appel à l'action -->
<div class="L" id="L4">
  <div class="a" id="rays" style="left:540px;top:820px;width:0;height:0"><div style="position:absolute;left:-900px;top:-900px;width:1800px;height:1800px;border-radius:50%;background:repeating-conic-gradient(rgba(29,79,184,.07) 0 10deg,transparent 10deg 20deg)"></div></div>
  <div class="a" id="sach4" style="left:0;top:0"><div class="sachet" style="width:560px;height:676px"></div></div>
  <div class="a sans" id="t4a" style="top:1250px;left:0;width:1080px;text-align:center;font-weight:600;font-size:44px;color:var(--brown);letter-spacing:6px">DISPONIBLE MAINTENANT</div>
  <div class="a cta" id="cta" style="top:1360px">Commandez dès aujourd'hui</div>
  <div class="a sans" id="t4b" style="top:1550px;left:0;width:1080px;text-align:center;font-size:36px;color:#6b5040">Votre numéro / lien ici</div>
</div>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,b)=>cl((t-a)/(b-a));
const oC=x=>1-Math.pow(1-x,3), iC=x=>x*x*x, ioC=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const oB=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function words(el,txt){el.innerHTML=txt.split(' ').map(w=>`<span class="word">${w}</span>`).join(' ');return [...el.children];}
function stag(ws,t,start,step,dur){ws.forEach((w,i)=>{const k=oB(p(t,start+i*step,start+i*step+dur));w.style.transform=`translateY(${(1-k)*120}px)`;w.style.opacity=cl(p(t,start+i*step,start+i*step+dur*.6));});}
function wipe(el,t,a,b){const k=ioC(p(t,a,b));el.style.clipPath=`circle(${k*1200}px at 50% 50%)`;el.style.display=t<a?'none':'block';}

// beans
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const beanSVG=`<svg width="90" height="120" viewBox="0 0 90 120"><defs><radialGradient id="bg" cx="35%" cy="30%"><stop offset="0" stop-color="#8b5530"/><stop offset="1" stop-color="#3a1f10"/></radialGradient></defs><ellipse cx="45" cy="60" rx="40" ry="56" fill="url(#bg)"/><path d="M45 8 C25 40 65 80 45 112" stroke="#1c0e06" stroke-width="7" fill="none" stroke-linecap="round"/></svg>`;
const beans=[];for(let i=0;i<22;i++){const d=document.createElement('div');d.className='a';d.innerHTML=beanSVG;$('beans').appendChild(d);beans.push({d,x:rnd()*1080-45,y0:-200-rnd()*900,v:700+rnd()*500,r0:rnd()*360,vr:(rnd()-.5)*300,s:.5+rnd()*.9,blur:rnd()<.35});}
const w1a=words($('s1a'),'Envie d\'une'),w1b=words($('s1b'),'pause café ?');
const w2=words($('t2'),'Cafe Latte');
const w3a=words($('t3a'),'Le plaisir d\'un latte'),w3b=words($('t3b'),'en un instant.');

window.render=function(t){
  // L1
  beans.forEach(b=>{const y=b.y0+b.v*t;b.d.style.transform=`translate(${b.x}px,${y}px) rotate(${b.r0+b.vr*t}deg) scale(${b.s})`;b.d.style.filter=b.blur?'blur(4px)':'none';b.d.style.opacity=b.blur?.5:1;});
  stag(w1a,t,.3,.12,.6);stag(w1b,t,.7,.15,.7);
  const z=1+p(t,1.8,2.8)*.15;$('s1a').style.scale=$('s1b').style.scale=z;
  // L2
  wipe($('L2'),t,2.2,2.9);
  const d1=oB(p(t,2.5,3.2));
  const enter=oB(p(t,2.6,3.6)), toTop=ioC(p(t,6.0,6.9)), outF=iC(p(t,9.9,10.4));
  const float=Math.sin(t*2.2)*14;
  let cy=lerp(lerp(-900,1000,enter),600,toTop)+float, sc=lerp(1,.72,toTop), rot=lerp(lerp(-30,-4,enter),5,toTop)+Math.sin(t*1.6)*1.5;
  $('sach').style.transform=`translate(${540-320}px,${cy-386}px) rotate(${rot}deg) scale(${sc})`;
  $('disc').style.transform=`translate(0,${lerp(0,600-1000,toTop)}px) scale(${d1*lerp(1,.78,toTop)})`;
  $('ring').style.transform=`rotate(${t*20}deg)`;
  $('shineBar').style.left=`${lerp(-250,800,ioC(p(t,4.0,4.9)))}px`;
  stag(w2,t,3.1,.2,.7); const hide=ioC(p(t,5.8,6.4));
  $('t2').style.opacity=1-hide;$('t2').style.transform=`translateY(${-hide*80}px)`;
  const sb=oC(p(t,3.6,4.2));$('t2b').style.opacity=sb*(1-hide);$('t2b').style.transform=`translateY(${(1-sb)*40+hide*60}px)`;
  [['p1',6.7,1020],['p2',7.3,1210],['p3',7.9,1400]].forEach(([id,s,y],i)=>{const k=oB(p(t,s,s+.7));const o=iC(p(t,9.7+i*.08,10.3+i*.08));$(id).style.transform=`translate(${(1-k)*1100-o*1200}px,${y}px)`;});
  // L3
  wipe($('L3'),t,10.1,10.8);
  const ck=oB(p(t,10.4,11.3));
  $('cup').style.transform=`scale(${ck}) rotate(${lerp(-90,0,ck)}deg)`;
  $('art').setAttribute('transform',`rotate(${Math.sin(t*1.2)*8})`);
  [1,2,3].forEach(i=>{const e=$('st'+i);const ph=(t*0.6+i*.33)%1;e.style.strokeDasharray='180 600';e.style.strokeDashoffset=lerp(500,-300,ph);e.style.opacity=p(t,11,11.6)*Math.sin(ph*Math.PI)*.9;});
  stag(w3a,t,11.2,.12,.6);stag(w3b,t,11.7,.14,.6);
  // L4
  wipe($('L4'),t,12.7,13.4);
  $('rays').style.transform=`rotate(${t*12}deg) scale(${oC(p(t,13,13.8))})`;
  const s4=oB(p(t,13.2,14.0));
  $('sach4').style.transform=`translate(${540-280}px,${820-338+Math.sin(t*2.2)*10}px) scale(${s4}) rotate(${lerp(-15,-3,s4)}deg)`;
  const a4=oC(p(t,13.7,14.2));$('t4a').style.opacity=a4;$('t4a').style.transform=`translateY(${(1-a4)*40}px)`;
  const c4=oB(p(t,13.9,14.5));$('cta').style.transform=`scale(${c4*(1+(t>14.5?Math.sin((t-14.5)*7)*.03:0))})`;
  const b4=oC(p(t,14.2,14.7));$('t4b').style.opacity=b4;
};
render(0);
</script></body></html>
