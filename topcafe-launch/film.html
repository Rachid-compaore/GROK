<html lang="fr"><head><meta charset="utf-8">

<style>
@font-face{font-family:Geist;src:url(assets/fonts/Geist-Variable.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Playfair;src:url(assets/fonts/playfair-display-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Playfair;src:url(assets/fonts/playfair-display-latin-700-italic.woff2);font-weight:700;font-style:italic}
:root{--canvas:#f5f5f2;--ink:#0e0e10;--lime:#cdf24f;--orange:#ff6a2a;--send:#2f6bff;--brand:#1d4fb8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--canvas)}
body{font-family:Geist,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.abs{position:absolute}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--canvas)}
#world{position:absolute;left:0;top:0;transform-origin:0 0;z-index:1}
/* téléphone */
#phone{position:absolute;left:735px;top:79px;width:450px;height:922px;border-radius:64px;background:var(--ink);
  box-shadow:0 40px 80px rgba(14,14,16,.18),0 8px 20px rgba(14,14,16,.12)}
#screen{position:absolute;left:11px;top:11px;width:428px;height:900px;border-radius:53px;overflow:hidden;background:#fbfbf9}
#island{left:154px;top:11px;width:120px;height:34px;border-radius:17px;background:var(--ink)}
#clock{left:38px;top:16px;font-weight:600;font-size:16px;letter-spacing:-.2px}
#header{left:0;width:428px;top:66px;text-align:center;font-weight:700;font-size:22px;color:var(--brand);letter-spacing:.5px}
#header svg{vertical-align:-3px;margin-right:6px}
#glow{border-radius:48px;background:conic-gradient(from 0deg,#ff5fa2,#ff6a2a,#cdf24f,#3fd8ff,#8b5cff,#ff5fa2);filter:blur(18px)}
#msg{overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(14,14,16,.08)}
#ripple{border-radius:50%;background:var(--lime)}
.line{position:absolute;left:0;white-space:pre;font-weight:500;letter-spacing:-.1px}
#caret{width:2px;background:var(--ink)}
#btn{z-index:5}
#btnShape{position:absolute;inset:0}
#plane{position:absolute;left:50%;top:50%}
#handle{height:8px;border-radius:4px;background:#c9471a;transform-origin:0 50%}
.ing{position:absolute;left:0;top:0}
#thinking{left:0;width:428px;text-align:center;font-size:19px;font-weight:500}
.shimmer{background:linear-gradient(90deg,#8a8a90 0%,#8a8a90 35%,#0e0e10 50%,#8a8a90 65%,#8a8a90 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.mask{overflow:hidden;display:inline-block;vertical-align:top}
.mask>span{display:inline-block}
/* réponse */
#avatar{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(14,14,16,.12);overflow:hidden;display:flex;align-items:center;justify-content:center}
#reply{background:#fff;border-radius:22px;box-shadow:0 8px 26px rgba(14,14,16,.08);transform-origin:0 0}
.rl{position:absolute;white-space:pre;font-size:14.5px;line-height:21px}
.pill{position:absolute;border-radius:25px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;overflow:hidden}
#order{background:var(--ink);color:#fff}
#more{border:1.5px solid var(--ink);background:#fff}
.lbl{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:8px}
/* cartes */
.card{position:absolute;left:0;top:0;width:330px;height:440px;border-radius:28px;background:var(--ink);overflow:hidden;transform-origin:50% 50%;box-shadow:0 24px 50px rgba(14,14,16,.28)}
.card img{width:330px;height:250px;object-fit:cover;display:block}
.card .nm{position:absolute;left:24px;top:268px;color:#fff;font-weight:600;font-size:23px;letter-spacing:-.3px}
.card .ds{position:absolute;left:24px;top:302px;color:#a1a1aa;font-size:15.5px}
.card .pr{position:absolute;left:24px;bottom:28px;color:#fff;font-weight:600;font-size:21px}
.card .rt{position:absolute;right:24px;bottom:28px;color:#fff;font-weight:600;font-size:19px}
.card .rt b{color:var(--orange)}
#overlay{position:absolute;inset:0;z-index:10;pointer-events:none}
#flood{position:absolute;background:var(--lime);overflow:hidden;z-index:10}
#floodWords{z-index:12;white-space:pre;font-weight:500}
#flyer{z-index:20}
#best{z-index:21;background:var(--ink);color:var(--lime);border-radius:20px;font-weight:600;font-size:17px;padding:0 18px;height:40px;display:flex;align-items:center;gap:8px;transform-origin:50% 100%}
#page{z-index:30;background:var(--ink);overflow:hidden}
#pageLabel{z-index:31;color:#fff;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:.4em;transform-origin:0 0}
.big{position:absolute;left:0;width:1920px;text-align:center;font-weight:600;font-size:92px;letter-spacing:-2.5px;color:#fff;white-space:nowrap;z-index:32}
#routeSvg{z-index:32}
#pin{z-index:33}
#wm{z-index:32;overflow:hidden}
#cursor{z-index:40}
</style></head><body>

        <svg class="abs" style="left:322px;top:19px" width="80" height="14" viewBox="0 0 80 14">
          <rect x="0" y="9" width="3.5" height="5" rx="1" fill="#0e0e10"/><rect x="5.5" y="6.5" width="3.5" height="7.5" rx="1" fill="#0e0e10"/><rect x="11" y="4" width="3.5" height="10" rx="1" fill="#0e0e10"/><rect x="16.5" y="1" width="3.5" height="13" rx="1" fill="#0e0e10"/>
          <path d="M28 5.2a10 10 0 0 1 13.4 0l-1.6 1.7a7.6 7.6 0 0 0-10.2 0zM31.1 8.4a5.6 5.6 0 0 1 7.2 0l-1.7 1.7a3.2 3.2 0 0 0-3.8 0zM34.7 12.2l1.1 1.1 1.1-1.1a1.6 1.6 0 0 0-2.2 0z" fill="#0e0e10"/>
          <rect x="50" y="1" width="25" height="12" rx="3.5" fill="none" stroke="#0e0e10" stroke-opacity=".4"/><rect x="52" y="3" width="20" height="8" rx="2" fill="#0e0e10"/><rect x="76.5" y="5" width="1.8" height="4" rx=".9" fill="#0e0e10" fill-opacity=".4"/>

          <div class="pill" id="order">

            <div class="lbl" id="lblSpin"><svg id="spin" width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="3"/><path d="M12 3a9 9 0 0 1 9 9" fill="none" stroke="#cdf24f" stroke-width="3" stroke-linecap="round"/></svg></div>

  <div id="overlay">
    <div id="flood"><div class="abs" id="cards"></div></div>

    <div class="abs" id="page"></div>

      <circle id="courier" r="13" fill="#ff6a2a" stroke="#fff" stroke-width="4"/>
    </svg>
    <div class="abs" id="pin"><div id="pinShape" class="abs"></div><svg id="markCup" class="abs" viewBox="0 0 64 40"><path d="M8 8h40v6a20 20 0 0 1-40 0z" fill="#fff"/><path d="M48 11h4a6 6 0 0 1 0 12h-6" fill="none" stroke="#fff" stroke-width="4"/><path d="M2 36h56" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg></div>

    <div class="abs" id="endTag" style="z-index:32;color:#cdf24f;font-size:26px;font-weight:600;white-space:nowrap"><span class="mask"><span>Crémeux et délicieux.</span></span></div>
    <img class="abs" id="endSachet" src="assets/sachet.png" style="z-index:32">

<script src="timeline.js"></script>
<script>
// ===================================================================== données
const E = window.EV;
const $ = id => document.getElementById(id);
const SX = 746, SY = 90;                 // origine de l'écran du téléphone dans le monde
const CARDS = [
  {img:"espresso",    nm:"Espresso Intense",   ds:"Riche et corsé",                pr:"500 FCFA", rt:"4,6"},
  {img:"creme",       nm:"Café crème",         ds:"Doux et velouté",               pr:"600 FCFA", rt:"4,7"},
  {img:"latte",       nm:"TOPCAFÉ Café Latte", ds:"3 en 1 · Crémeux et délicieux", pr:"150 FCFA", rt:"4,9"},
  {img:"cafe-au-lait",nm:"Café au lait",       ds:"Doux et équilibré",             pr:"600 FCFA", rt:"4,5"},
];
const PICK = 2;
const REPLY = ["Trouvé ! Le TOPCAFÉ", "Café Latte 3 en 1 :", "crémeux, doux et", "délicieux, parfait pour", "bien démarrer la journée."];
const LINE1 = "Vous rêviez d'un café crémeux.".split(" ");
const LINE2 = "Il est déjà en route.".split(" ");

// géométrie (coordonnées écran du téléphone)
const COMPOSER = {x:16, y:300, w:396, h:180, r:34, fs:17, lh:27, px:26, py:30};
const BUBBLE   = {x:96, y:112, w:316, h:104, r:24, fs:14.5, lh:23, px:18, py:15};
const BTN0 = {x:362, y:438, d:50};
const WOK  = {x:214, y:560, w:170, h:85};
const SLOT = {x:80, y:252, w:84, h:112};
const REPLYBOX = {x:64, y:236, w:348, h:314};
const ORDER = {x:82, y:420, w:314, h:50};
const MORE  = {x:82, y:482, w:314, h:46};
const ENDMARK = {x:560, y:560, d:150};

// ===================================================================== outils
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ioC = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const oC = k => 1 - Math.pow(1 - k, 3);
const oQ = k => 1 - Math.pow(1 - k, 4);
const iC = k => k * k * k;
/** ressort amorti en forme fermée (réponse indicielle), 0 → 1 */
function spring(t, f = 2.4, z = 0.55) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * f;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
/** impulsion amortie (pour secousses), 0 → pic → 0 */
const kick = (t, f = 3, d = 7) => t <= 0 ? 0 : Math.exp(-d * t) * Math.sin(2 * Math.PI * f * t);
const px = v => v + "px";
function box(el, r) { el.style.left = px(r.x); el.style.top = px(r.y); el.style.width = px(r.w); el.style.height = px(r.h); }
function rectLerp(a, b, k) { return {x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), w: lerp(a.w, b.w, k), h: lerp(a.h, b.h, k), r: lerp(a.r ?? 0, b.r ?? 0, k)}; }
const show = (el, on) => { el.style.display = on ? "" : "none"; };
/** texte qui monte depuis une ligne de masque : p ∈ [0,1] entrée, q ∈ [0,1] sortie */
function rise(el, p, q = 0) { el.style.transform = `translateY(${(1 - p) * 110 - q * 110}%)`; }

// ===================================================================== caméra
// [temps, zoom, cx, cy] — segments adoucis, zoom interpolé en espace log.
const CAM = [
  [0.00, 2.00, 952, 482],
  [E.send - 0.08, 3.00, 948, 480],
  [E.send + 0.05, 3.00, 948, 480],
  [E.send + 0.95, 1.00, 960, 540],
  [E.drop, 1.07, 960, 556],
  [E.drop + 0.37, 1.07, 960, 556],
  [E.drop + 0.371, 1.36, 960, 410],   // invisible : l'aplat citron couvre tout l'écran
  [E.chat, 1.36, 960, 410],
  [E.outro, 1.48, 960, 432],
  [E.outro + 0.6, 5.0, 0, 0],          // cx/cy remplacés par le centre du bouton
];
function camera(t) {
  let i = 0;
  while (i < CAM.length - 2 && t > CAM[i + 1][0]) i++;
  const a = CAM[i], b = CAM[i + 1];
  const k = ioC(prog(t, a[0], b[0]));
  let bx = b[2], by = b[3];
  if (b[2] === 0) { bx = SX + ORDER.x + ORDER.w / 2; by = SY + ORDER.y + ORDER.h / 2; }
  return {z: Math.exp(lerp(Math.log(a[1]), Math.log(b[1]), k)), cx: lerp(a[2], bx, k), cy: lerp(a[3], by, k)};
}
let CAMNOW = {z: 1, cx: 960, cy: 540};
/** coordonnées écran-téléphone → pixels du film */
function proj(sx, sy) { const c = CAMNOW; return {x: (SX + sx - c.cx) * c.z + 960, y: (SY + sy - c.cy) * c.z + 540}; }
function projRect(r) { const p = proj(r.x, r.y); return {x: p.x, y: p.y, w: r.w * CAMNOW.z, h: r.h * CAMNOW.z, r: (r.r ?? 0) * CAMNOW.z}; }

// ===================================================================== construction (une fois)
const typed = E.request;
const flat = typed.join("\n");
function makeCard(c) {
  const d = document.createElement("div"); d.className = "card";
  d.innerHTML = `<img src="assets/${c.img}.jpg"><div class="nm">${c.nm}</div><div class="ds">${c.ds}</div><div class="pr">${c.pr}</div><div class="rt"><b>★</b> ${c.rt}</div>`;
  return d;
}
const cardEls = CARDS.map(c => { const d = makeCard(c); $("cards").appendChild(d); return d; });
const flyer = makeCard(CARDS[PICK]); $("flyer").appendChild(flyer);
const slotCard = makeCard(CARDS[PICK]); $("slot").appendChild(slotCard);
slotCard.style.transformOrigin = "0 0"; slotCard.style.transform = `scale(${SLOT.w / 330})`; slotCard.style.boxShadow = "none";
flyer.style.transformOrigin = "0 0";
box($("slot"), SLOT); $("slot").style.left = px(SLOT.x - REPLYBOX.x); $("slot").style.top = px(SLOT.y - REPLYBOX.y);
$("slot").style.borderRadius = "9px"; $("slot").style.overflow = "hidden";
REPLY.forEach((l, i) => {
  const d = document.createElement("div"); d.className = "rl";
  d.style.left = px(178 - REPLYBOX.x); d.style.top = px(254 - REPLYBOX.y + i * 21);
  const html = i < 2 ? l.replace("TOPCAFÉ", "<b>TOPCAFÉ</b>").replace("Café Latte 3 en 1", "<b>Café Latte 3 en 1</b>") : l;
  d.innerHTML = `<span class="mask"><span>${html}</span></span>`;
  $("replyLines").appendChild(d);
});
$("ask2").style.left = px(ORDER.x - REPLYBOX.x); $("ask2").style.top = px(386 - REPLYBOX.y);
["order", "more"].forEach(id => { const r = id === "order" ? ORDER : MORE; box($(id), {x: r.x - REPLYBOX.x, y: r.y - REPLYBOX.y, w: r.w, h: r.h}); });
$("floodWords").innerHTML = typed.map(l => `<div><span class="mask"><span>${l}</span></span></div>`).join("");
const fwSpans = [...$("floodWords").querySelectorAll(".mask>span")];
const big1 = LINE1.map(w => `<span class="mask"><span>${w}</span></span>`).join(" ");
$("big1").innerHTML = big1; $("big2").innerHTML = LINE2.map((w, i) => `<span class="mask"><span${i >= 3 ? ' style="color:#cdf24f"' : ""}>${w}</span></span>`).join(" ");
const b1 = [...$("big1").querySelectorAll(".mask>span")], b2 = [...$("big2").querySelectorAll(".mask>span")];
$("big1").style.top = "418px"; $("big2").style.top = "540px";
// ingrédients : grain, goutte de lait, sucre, cannelle, cacao, caramel
const ING = [
  {svg:'<svg width="30" height="38" viewBox="0 0 30 38"><ellipse cx="15" cy="19" rx="13" ry="17" fill="#6b3b1e"/><path d="M15 3c-5 9 5 22 0 32" stroke="#2a1309" stroke-width="3" fill="none"/></svg>', w:30, h:38, vx:-120, v:620},
  {svg:'<svg width="28" height="36" viewBox="0 0 28 36"><path d="M14 2C9 12 3 17 3 24a11 11 0 0 0 22 0c0-7-6-12-11-22z" fill="#fff" stroke="#d9dde4" stroke-width="2"/></svg>', w:28, h:36, vx:70, v:700},
  {svg:'<svg width="30" height="30" viewBox="0 0 30 30"><rect x="2" y="2" width="26" height="26" rx="5" fill="#fff" stroke="#e2e2dc" stroke-width="2"/><rect x="6" y="6" width="9" height="9" rx="2" fill="#f1f1ec"/></svg>', w:30, h:30, vx:150, v:560},
  {svg:'<svg width="46" height="16" viewBox="0 0 46 16"><rect x="1" y="2" width="44" height="12" rx="6" fill="#b5622c"/><rect x="1" y="2" width="44" height="5" rx="2.5" fill="#d98a4a"/></svg>', w:46, h:16, vx:-40, v:760},
  {svg:'<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="#3b1d0e"/><circle cx="9" cy="9" r="3" fill="#5c3018"/></svg>', w:26, h:26, vx:-170, v:520},
  {svg:'<svg width="30" height="26" viewBox="0 0 30 26"><path d="M4 18c-3-8 6-15 13-12 8-4 14 6 9 12-3 5-19 6-22 0z" fill="#ffb21f"/><path d="M9 12c3-3 8-3 11 0" stroke="#ffd36a" stroke-width="3" fill="none" stroke-linecap="round"/></svg>', w:30, h:26, vx:110, v:650},
];
const ingEls = ING.map(g => { const d = document.createElement("div"); d.className = "ing"; d.innerHTML = g.svg; $("ings").appendChild(d); return d; });

// ===================================================================== seek(t)
function seek(t) {
  // ---------- caméra
  CAMNOW = camera(t);
  const c = CAMNOW;
  $("world").style.transform = `translate(960px,540px) scale(${c.z}) translate(${-c.cx}px,${-c.cy}px)`;

  // ---------- ASK : saisie de la demande
  const nTyped = E.keys.filter(k => k <= t).length;
  let left = nTyped;

  // message : composer → bulle (ripple citron puis morphing)

  for (let i = 0; i < 3; i++) { const l = $("l" + i); l.style.fontSize = px(fs); l.style.top = px(i * lh); }
  // curseur de saisie
  const curLine = Math.min(2, typed.findIndex((l, i) => typed.slice(0, i + 1).join("\n").length >= nTyped));
  const caretOn = t < E.send && (t < E.typeEnd + 0.05 || Math.floor(t * 2.6) % 2 === 0);
  show($("caret"), caretOn);
  if (caretOn) { const L = $("l" + Math.max(0, curLine)); $("caret").style.left = px(L.offsetWidth + 2); $("caret").style.top = px(Math.max(0, curLine) * lh + 3); $("caret").style.height = px(fs * 1.25); }
  // ripple : depuis le bouton d'envoi jusqu'au coin le plus éloigné du composer
  const bxl = BTN0.x - COMPOSER.x, byl = BTN0.y - COMPOSER.y;
  const R = Math.hypot(Math.max(bxl, COMPOSER.w - bxl), Math.max(byl, COMPOSER.h - byl)) + 4;

  // lueur irisée : tourne, puis se rétracte derrière la bulle

  g.style.borderRadius = px(M.r + spread);
  // la lueur respire doucement
